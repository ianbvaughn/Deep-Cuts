models:
  - name: gold_api_logs_daily
    description: '{{ doc("gold_api_logs_daily") }}'
    config:
      tags: transformed
    columns:
      - name: created_day
        description: Calendar day
        constraints:
          - type: unique
      - name: status
        description: Status inherited from upstream
      - name: count
        description: Number of API calls for given aggregation
      - name: avg_response_time
        description: Average response time for given aggregation
  - name: gold_unique_ips
    description: '{{ doc("gold_unique_ips") }}'
    config:
      tags: transformed
    columns:
      - name: ip_address
      - name: first_seen_ts
        description: When the public IP made its first request to the server